<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CPTS Exam Mindmap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e0e0e0;font-family:'Segoe UI',sans-serif;font-size:13px}
#toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:#111;border-bottom:1px solid #333;z-index:9999;display:flex;align-items:center;gap:8px;padding:0 12px;flex-wrap:wrap}
#toolbar input[type=text]{background:#1e1e1e;border:1px solid #444;color:#e0e0e0;padding:4px 8px;border-radius:4px;font-size:12px}
#tip-lhost,#tip-rhost{width:120px}
#tip-lport,#tip-rport{width:58px}
#tip-user,#tip-pass,#tip-dom{width:100px}
#srch{width:150px}
#toolbar label{color:#888;font-size:11px}
#toolbar button{background:#1e1e1e;border:1px solid #444;color:#ccc;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
#toolbar button:hover{background:#2a2a2a}
#cv{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#cv.panning{cursor:grabbing}
#wd{position:absolute;transform-origin:0 0}
svg#lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}
#legend{position:absolute;left:14px;top:14px;background:#111;border:1px solid #333;border-radius:6px;padding:10px 14px;z-index:2000;min-width:210px;max-height:calc(100vh - 120px);overflow-y:auto}
#legend h3{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;border-bottom:1px solid #222;padding-bottom:5px}
.phase-group{margin-bottom:8px}
.phase-group-hd{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.6px;padding:2px 0 3px;border-bottom:1px solid #1e1e1e;margin-bottom:2px}
.rl{display:flex;align-items:center;gap:7px;padding:2px 4px;cursor:pointer;font-size:11.5px;color:#bbb;border-radius:3px}
.rl:hover{background:#1e1e1e;color:#fff}
.rl .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.nd{position:absolute;border-radius:5px;border:1px solid #2a2a2a;border-left-width:4px;background:#111;min-width:250px;max-width:340px;z-index:1;box-shadow:0 4px 20px rgba(0,0,0,0.7)}
.nd.front{z-index:100}
.nh{background:#151515;border-bottom:1px solid #222;padding:7px 10px;cursor:move;display:flex;align-items:center;justify-content:space-between;border-radius:4px 4px 0 0;user-select:none}
.nh .title{font-weight:600;font-size:12px;letter-spacing:.3px;flex:1}
.nh .btns{display:flex;gap:3px;flex-shrink:0}
.nh button{background:none;border:none;color:#555;cursor:pointer;font-size:13px;padding:0 3px;line-height:1}
.nh button:hover{color:#ccc}
.nb{padding:2px 0 6px;max-height:520px;overflow-y:auto;overscroll-behavior:contain}
.nb::-webkit-scrollbar{width:4px}
.nb::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.nb::-webkit-scrollbar-thumb:hover{background:#555}
.nd.col .nb{display:none}
.it{position:relative;padding:3px 8px 3px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11.5px;line-height:1.4;min-height:22px}
.it:hover .cp{display:block}
.it:hover{background:#1a1a1a}
.it.sub-hd{color:#999;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-left:2px solid #2a2a2a;padding-left:8px;margin-top:3px;background:#141414}
.it.sub-hd:hover{background:#1c1c1c}
.it.note{color:#555;font-style:italic;cursor:default;font-size:11px}
.it .lbl{flex:1;word-break:break-word;overflow:hidden}
.it .cp{display:none;background:#1b3a2b;border:1px solid #2d5a3d;color:#6adfb0;padding:1px 5px;border-radius:3px;font-size:10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.it .cp:hover{background:#2d5a3d}
.cmd-box{display:none;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:4px;margin:2px 6px 4px 6px;padding:5px 8px;font-family:monospace;font-size:10.5px;color:#6adfb0;word-break:break-all;white-space:pre-wrap;line-height:1.5;user-select:text;cursor:text}
.it.show-cmd+.cmd-box{display:block}
.it .tog{color:#444;font-size:10px;flex-shrink:0;min-width:10px}
.it.has-sub>.tog{color:#666}
.si{display:none;background:#0e0e0e;border-left:2px solid #1e1e1e;margin-left:8px}
.si .it{font-size:11px;padding-left:16px}
.badge{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:700;margin-left:3px;flex-shrink:0;background:rgba(100,220,180,0.12);color:#6adfb0}
.dim{opacity:.12}
.hl .nh{outline:2px solid #5af}
.phase-label{position:absolute;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;opacity:.7;pointer-events:none;white-space:nowrap;padding:4px 12px;border-radius:4px}
</style>
</head>

</div>

    c('crt.sh subdomains','curl -s "https://crt.sh/?q=%25.TARGET_DOMAIN&output=json" | jq ".[].name_value"'),
    c('Wayback URLs','waybackurls TARGET_DOMAIN'),
  ]),
  h('Active Recon',[
    c('DNS brute force','gobuster dns -d TARGET_DOMAIN -w subdomains.txt'),
    c('Zone transfer','dig axfr TARGET_DOMAIN @NAMESERVER'),
    c('DNS enum','dnsenum TARGET_DOMAIN'),
    c('fierce','fierce --domain TARGET_DOMAIN'),
  ]),
  h('Email & Social',[
    c('Hunter.io','hunter.io → find emails for domain'),
    c('LinkedIn recon','Search company employees on LinkedIn'),
    c('Phonebook.cz','phonebook.cz → email/domain/URL search'),
    c('Have I Been Pwned','haveibeenpwned.com → check breached creds'),
    nt('Build username list from names: first.last, f.last, firstl'),
  ]),
]}

];


// Token substitution
function getV(id){const el=document.getElementById(id);return el?el.value.trim()||el.placeholder:'';}
function tok(s){
  if(!s) return s;
  return s
    .replace(/LHOST/g,getV('tip-lhost'))
    .replace(/LPORT/g,getV('tip-lport'))
    .replace(/RHOST/g,getV('tip-rhost'))
    .replace(/RPORT/g,getV('tip-rport'))
    .replace(/TARGET_USER/g,getV('tip-user'))
    .replace(/TARGET_PASS/g,getV('tip-pass'))
    .replace(/TARGET_DOMAIN/g,getV('tip-dom'));
}

// Phase definitions for legend + labels
const PHASES=[
  {label:'Phase 1 — Reconnaissance & OSINT',color:'#4fc3f7',ids:['recon','nmap','footprint','netrecon']},
  {label:'Phase 2 — Web Enum & Fuzzing',color:'#ce93d8',ids:['webenum','sqli','webattacks','burp','fileuploadatk','ffuf']},
  {label:'Phase 3 — Web Exploitation',color:'#ff9800',ids:['cmdinj','xss','fileinc','ssti','ssrf','xxe','idor']},
  {label:'Phase 4 — Exploitation & Access',color:'#a5d6a7',ids:['bruteforce','shells','shellspayloads','metasploit','passcrack']},
  {label:'Phase 5 — Post-Exploitation',color:'#fff176',ids:['filetransfer','linprivesc','winprivesc','postexploit']},
  {label:'Phase 6 — Lateral Movement',color:'#80deea',ids:['services','pivoting']},
  {label:'Phase 7 — Active Directory',color:'#f48fb1',ids:['ad']},
  {label:'Phase 8 — Attacking Applications',color:'#009688',ids:['commonapps','vulnassess']},
  {label:'Phase 9 — Full Chain & Reporting',color:'#ffab91',ids:['fullchain','reporting']},
];

const canvas=document.getElementById('cv');
const world=document.getElementById('wd');
const svgEl=document.getElementById('lines');
let tx=220,ty=20,scale=0.72;
const nodeEls={};
const nodeMap={};
DATA.filter(Boolean).forEach(d=>nodeMap[d.id]=d);

function updateTransform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
updateTransform();

let frontZ=10;
function bringToFront(el){
  frontZ++;
  document.querySelectorAll('.nd.front').forEach(n=>n.classList.remove('front'));
  el.classList.add('front');
  el.style.zIndex=frontZ;
}

// Build a single item row
function buildItem(item,depth){
  const wrap=document.createElement('div');
  // Note type
  if(item.type==='nt'||item.note){
    wrap.className='it note';
    wrap.style.paddingLeft=(18+depth*10)+'px';
    wrap.textContent='› '+(item.label||'');
    return wrap;
  }
  // Command item (c or cc)
  if(item.type==='c'||item.type==='cc'||item.cmd){
    const cmd=item.cmd||(item.type==='cc'?item.label:null);
    const label=item.label&&item.type!=='cc'?item.label:(cmd&&cmd.length>60?cmd.substring(0,60)+'…':cmd);
    wrap.className='it';
    wrap.style.paddingLeft=(18+depth*10)+'px';
    const lbl=document.createElement('span');
    lbl.className='lbl';
    lbl.textContent=label||'';
    if(cmd) lbl.title=cmd;
    wrap.appendChild(lbl);
    if(cmd){
      const badge=document.createElement('span');
      badge.className='badge';
      badge.textContent='CMD';
      wrap.appendChild(badge);
      const cp=document.createElement('button');
      cp.className='cp';
      cp.textContent='Copy';
      cp.addEventListener('click',e=>{
        e.stopPropagation();
        navigator.clipboard.writeText(tok(cmd)).catch(()=>{});
        cp.textContent='✓';
        setTimeout(()=>cp.textContent='Copy',1200);
      });
      wrap.appendChild(cp);
      const cmdBox=document.createElement('div');
      cmdBox.className='cmd-box';
      wrap.addEventListener('click',e=>{
        e.stopPropagation();
        wrap.classList.toggle('show-cmd');
        if(wrap.classList.contains('show-cmd')){
          cmdBox.textContent=tok(cmd);
          wrap.after(cmdBox);
        } else {
          if(cmdBox.parentNode) cmdBox.parentNode.removeChild(cmdBox);
        }
        const pn=wrap.closest('.nd');
        if(pn) bringToFront(pn);
      });
    }
    return wrap;
  }
  // Sub-section (t type — indented section)
  if(item.type==='t'&&item.items){
    const sec=document.createElement('div');
    sec.className='it has-sub';
    sec.style.paddingLeft=(18+depth*10)+'px';
    const lbl=document.createElement('span');
    lbl.className='lbl';
    lbl.textContent='› '+(item.label||'');
    lbl.style.color='#888';
    sec.appendChild(lbl);
    const tog=document.createElement('span');
    tog.className='tog';
    tog.textContent='▶';
    sec.appendChild(tog);
    const si=document.createElement('div');
    si.className='si';
    item.items.forEach(sub=>si.appendChild(buildItem(sub,depth+1)));
    sec.addEventListener('click',e=>{
      e.stopPropagation();
      sec.classList.toggle('op');
      tog.textContent=sec.classList.contains('op')?'▼':'▶';
      si.style.display=sec.classList.contains('op')?'block':'none';
      const pn=sec.closest('.nd');
      if(pn) bringToFront(pn);
    });
    si.style.display='none';
    sec.after(si);
    return sec;
  }
  // Fallback: plain label
  wrap.className='it note';
  wrap.style.paddingLeft=(18+depth*10)+'px';
  wrap.textContent=item.label||'';
  return wrap;
}

function buildNode(d){
  if(!d) return;
  const el=document.createElement('div');
  el.className='nd col';
  el.style.left=d.x+'px';
  el.style.top=d.y+'px';
  el.style.zIndex=1;
  el.style.borderLeftColor=d.color;

  // Header
  const nh=document.createElement('div');
  nh.className='nh';
  const sp=document.createElement('span');
  sp.className='title';
  sp.textContent=d.label;
  sp.style.color=d.color;
  nh.appendChild(sp);

  const btns=document.createElement('div');
  btns.className='btns';
  const colBtn=document.createElement('button');
  colBtn.textContent='⊕';
  colBtn.title='Expand/Collapse';
  colBtn.addEventListener('click',e=>{
    e.stopPropagation();
    el.classList.toggle('col');
    colBtn.textContent=el.classList.contains('col')?'⊕':'⊖';
    bringToFront(el);
    requestAnimationFrame(drawLines);
  });
  btns.appendChild(colBtn);
  nh.appendChild(btns);
  el.appendChild(nh);

  // Body
  const nb=document.createElement('div');
  nb.className='nb';
  // Stop wheel from propagating to canvas
  nb.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});

  (d.items||[]).forEach(item=>{
    if(item.type==='h'&&item.items){
      // Section header
      const sec=document.createElement('div');
      sec.className='it sub-hd has-sub';
      const secLbl=document.createElement('span');
      secLbl.className='lbl';
      secLbl.textContent=item.label;
      sec.appendChild(secLbl);
      const tog=document.createElement('span');
      tog.className='tog';
      tog.textContent='▶';
      sec.appendChild(tog);
      nb.appendChild(sec);
      const si=document.createElement('div');
      si.className='si';
      si.style.display='none';
      item.items.forEach(sub=>si.appendChild(buildItem(sub,0)));
      nb.appendChild(si);
      sec.addEventListener('click',e=>{
        e.stopPropagation();
        const open=sec.classList.toggle('op');
        tog.textContent=open?'▼':'▶';
        si.style.display=open?'block':'none';
        bringToFront(el);
      });
    } else {
      nb.appendChild(buildItem(item,0));
    }
  });

  el.appendChild(nb);

  // Drag by header
  let dragging=false,ox=0,oy=0;
  nh.addEventListener('mousedown',e=>{
    if(e.target===colBtn) return;
    e.stopPropagation(); e.preventDefault();
    dragging=true;
    ox=e.clientX-d.x*scale-tx;
    oy=e.clientY-d.y*scale-ty;
    bringToFront(el);
    const onMv=e=>{
      if(!dragging) return;
      d.x=(e.clientX-tx-ox)/scale;
      d.y=(e.clientY-ty-oy)/scale;
      el.style.left=d.x+'px';
      el.style.top=d.y+'px';
      requestAnimationFrame(drawLines);
    };
    const onUp=()=>{dragging=false;document.removeEventListener('mousemove',onMv);document.removeEventListener('mouseup',onUp)};
    document.addEventListener('mousemove',onMv);
    document.addEventListener('mouseup',onUp);
  });
  el.addEventListener('mousedown',()=>bringToFront(el));
  nodeEls[d.id]=el;
  world.appendChild(el);
}

// Draw elbow connectors
function elbowPath(x1,y1,x2,y2){
  const midX=x1+Math.max(40,(x2-x1)/2);
  return `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
}
function drawLines(){
  svgEl.innerHTML='';
  svgEl.setAttribute('width',Math.max(world.scrollWidth,8000));
  svgEl.setAttribute('height',Math.max(world.scrollHeight,8000));
  const connections=[
    ['recon','nmap'],['nmap','footprint'],['recon','netrecon'],
    ['recon','webenum'],['nmap','webenum'],['recon','ffuf'],['ffuf','webenum'],
    ['webenum','sqli'],['webenum','webattacks'],['webattacks','fileuploadatk'],['burp','webattacks'],
    ['webenum','cmdinj'],['webenum','xss'],['webenum','fileinc'],['webenum','ssti'],['webenum','ssrf'],['webenum','xxe'],['webenum','idor'],
    ['sqli','shells'],['webattacks','shells'],['fileuploadatk','shells'],['cmdinj','shells'],['fileinc','shells'],['ssti','shells'],
    ['bruteforce','shells'],['shells','shellspayloads'],['shells','metasploit'],['passcrack','bruteforce'],
    ['shells','filetransfer'],['shells','linprivesc'],['shells','winprivesc'],['shells','postexploit'],
    ['linprivesc','pivoting'],['winprivesc','pivoting'],['services','pivoting'],
    ['bruteforce','services'],['pivoting','ad'],['services','ad'],
    ['webenum','commonapps'],['nmap','vulnassess'],
    ['ad','fullchain'],['linprivesc','fullchain'],['winprivesc','fullchain'],
    ['fullchain','reporting'],
  ];
  connections.forEach(([a,b])=>{
    const na=nodeEls[a], nb=nodeEls[b];
    if(!na||!nb) return;
    const ad=nodeMap[a];
    const bd=nodeMap[b];
    if(!ad||!bd) return;
    const x1=ad.x+na.offsetWidth;
    const y1=ad.y+20;
    const x2=bd.x;
    const y2=bd.y+20;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',elbowPath(x1,y1,x2,y2));
    path.setAttribute('stroke',ad.color);
    path.setAttribute('fill','none');
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('opacity','0.4');
    path.setAttribute('stroke-dasharray','5,4');
    svgEl.appendChild(path);
  });
}

// Build all nodes
DATA.filter(Boolean).forEach(d=>buildNode(d));

// Phase labels in world
PHASES.forEach(p=>{
  // Find leftmost/topmost node in this phase
  let minX=Infinity,minY=Infinity;
  p.ids.forEach(id=>{const d=nodeMap[id];if(d){minX=Math.min(minX,d.x);minY=Math.min(minY,d.y);}});
  if(minX===Infinity) return;
  const lbl=document.createElement('div');
  lbl.className='phase-label';
  lbl.style.left=minX+'px';
  lbl.style.top=(minY-26)+'px';
  lbl.style.color=p.color;
  lbl.style.background='color-mix(in srgb,'+p.color+' 7%,#000)';
  lbl.style.borderLeft='3px solid '+p.color;
  lbl.textContent=p.label.toUpperCase();
  world.appendChild(lbl);
});

// Legend panel
const legend=document.getElementById('legend');
PHASES.forEach(p=>{
  const pg=document.createElement('div');
  pg.className='phase-group';
  const phd=document.createElement('div');
  phd.className='phase-group-hd';
  phd.textContent=p.label;
  phd.style.color=p.color;
  pg.appendChild(phd);
  p.ids.forEach(id=>{
    const d=nodeMap[id];
    if(!d) return;
    const row=document.createElement('div');
    row.className='rl';
    row.innerHTML=`<span class="dot" style="background:${d.color}"></span>${d.label}`;
    row.addEventListener('click',()=>{
      const el=nodeEls[id];
      if(!el) return;
      el.classList.remove('col');
      el.querySelector('.nh button').textContent='⊖';
      bringToFront(el);
      tx=canvas.clientWidth/2-d.x*scale-140;
      ty=canvas.clientHeight/2-d.y*scale-60;
      updateTransform();
      requestAnimationFrame(drawLines);
    });
    pg.appendChild(row);
  });
  legend.appendChild(pg);
});

// Token update (refresh open cmd boxes)
document.querySelectorAll('#toolbar input[type=text]').forEach(inp=>{
  inp.addEventListener('input',()=>{
    document.querySelectorAll('.cmd-box').forEach(box=>{
      if(box.style.display!=='none'){
        const wrap=box.previousElementSibling;
        if(wrap&&wrap._cmdRaw) box.textContent=tok(wrap._cmdRaw);
      }
    });
  });
});

// Canvas pan
let px=0,py=0,panning=false;
canvas.addEventListener('mousedown',e=>{
  if(e.target.closest('.nd')||e.target.closest('#legend')||e.target.closest('button')||e.target.closest('input')) return;
  panning=true; px=e.clientX; py=e.clientY;
  canvas.classList.add('panning');
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!panning) return;
  tx+=e.clientX-px; ty+=e.clientY-py;
  px=e.clientX; py=e.clientY;
  updateTransform();
});
document.addEventListener('mouseup',()=>{panning=false;canvas.classList.remove('panning')});

// Zoom
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY>0?0.92:1.08;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  const my=e.clientY-rect.top;
  tx=mx-(mx-tx)*delta;
  ty=my-(my-ty)*delta;
  scale=Math.max(0.1,Math.min(3,scale*delta));
  updateTransform();
  requestAnimationFrame(drawLines);
},{passive:false});

// Toolbar controls
function resetZoom(){tx=220;ty=20;scale=0.72;updateTransform();requestAnimationFrame(drawLines);}
function expandAll(){
  document.querySelectorAll('.nd').forEach(el=>{
    el.classList.remove('col');
    const btn=el.querySelector('.nh button');
    if(btn) btn.textContent='⊖';
  });
  requestAnimationFrame(drawLines);
}
function collapseAll(){
  document.querySelectorAll('.nd').forEach(el=>{
    el.classList.add('col');
    const btn=el.querySelector('.nh button');
    if(btn) btn.textContent='⊕';
  });
  requestAnimationFrame(drawLines);
}

// Search
document.getElementById('srch').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  Object.keys(nodeEls).forEach(id=>{
    const el=nodeEls[id];
    const d=nodeMap[id];
    if(!d) return;
    if(!q){el.classList.remove('dim','hl');return;}
    const match=d.label.toLowerCase().includes(q)||JSON.stringify(d.items||[]).toLowerCase().includes(q);
    el.classList.toggle('dim',!match);
    el.classList.toggle('hl',match);
    if(match){el.classList.remove('col');const b=el.querySelector('.nh button');if(b)b.textContent='⊖';}
  });
});

setTimeout(drawLines,200);
window.addEventListener('resize',drawLines);
</script>
